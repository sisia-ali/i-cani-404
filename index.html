
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Razze di Cani</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Razze di Cani</h1>
    <p>Scopri alcune delle razze canine più amate</p>
    <input type="color" id="colorPicker" />
</header>

<section class="hero">
    <img src="images/hero.png" alt="Cani felici">
</section>

<section class="breeds">
    <div class="card">
        <img src="images/golden.png">
        <h2>Golden Retriever</h2>
        <p>Affettuoso, intelligente e perfetto per la famiglia.</p>
    </div>
    <div class="card">
        <img src="images/labrador.png">
        <h2>Labrador</h2>
        <p>Socievole, energico e molto leale.</p>
    </div>
    <div class="card">
        <img src="images/cavalier.png">
        <h2>Cavalier King Charles</h2>
        <p>Elegante, dolce e ideale per la compagnia.</p>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
